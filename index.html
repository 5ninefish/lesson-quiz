<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hōkūlani</title>
<style>
  /* ── Reset & base ─────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #f5f7fa;
    --card:     #ffffff;
    --primary:  #2563eb;
    --primary-h:#1d4ed8;
    --success:  #16a34a;
    --danger:   #dc2626;
    --border:   #e2e8f0;
    --text:     #1e293b;
    --muted:    #64748b;
    --radius:   10px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  body.signed-out {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
    width: 100%;
    max-width: 540px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }

  h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: .25rem; }
  h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 1.25rem; }
  p  { color: var(--muted); font-size: .9rem; margin-bottom: 1rem; }

  label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: .3rem; }

  input[type=text],
  input[type=password] {
    width: 100%;
    padding: .6rem .8rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 1rem;
    margin-bottom: 1rem;
    outline: none;
  }
  input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.15); }

  .btn {
    display: inline-block;
    padding: .65rem 1.4rem;
    border: none;
    border-radius: 6px;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }
  .btn-primary { background: var(--primary); color: #fff; width: 100%; }
  .btn-primary:hover { background: var(--primary-h); }
  .btn-sm { padding: .45rem 1rem; font-size: .85rem; }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-outline:hover { background: var(--bg); }

  .error {
    background: #fef2f2;
    color: var(--danger);
    border: 1px solid #fecaca;
    border-radius: 6px;
    padding: .6rem .9rem;
    font-size: .875rem;
    margin-bottom: 1rem;
  }

  .info {
    background: #eff6ff;
    color: var(--primary);
    border: 1px solid #bfdbfe;
    border-radius: 6px;
    padding: .6rem .9rem;
    font-size: .875rem;
    margin-bottom: 1rem;
  }

  /* ── Lesson selector ─────────────────────────────────────────────── */
  .lesson-grid {
    display: flex;
    flex-direction: column;
    gap: .6rem;
    margin-bottom: 1rem;
  }

  .lesson-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: .8rem 1rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    cursor: pointer;
    font-size: .95rem;
    font-weight: 500;
    transition: border-color .15s, background .15s;
  }
  .lesson-btn:hover:not(:disabled) { border-color: var(--primary); background: #eff6ff; }
  .lesson-btn:disabled { opacity: .5; cursor: not-allowed; }

  .teach-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    padding: .9rem 1rem;
  }
  .teach-card h3 { margin: 0 0 .35rem; font-size: 1rem; }
  .teach-actions { display: flex; flex-wrap: wrap; gap: .45rem; margin-top: .55rem; }
  .teach-actions button { flex: 1 1 8rem; }

  .lesson-badge {
    font-size: .75rem;
    font-weight: 700;
    padding: .2rem .55rem;
    border-radius: 20px;
  }
  .badge-ok      { background: #dcfce7; color: #166534; }
  .badge-warn    { background: #fef9c3; color: #854d0e; }
  .badge-blocked { background: #fee2e2; color: #991b1b; }

  /* ── Accordion questions ─────────────────────────────────────────── */
  details.question-block {
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: .5rem;
    overflow: hidden;
    background: var(--card);
  }
  details.question-block[open] { border-color: var(--primary); }

  summary.q-header {
    display: flex;
    align-items: flex-start;
    gap: .5rem;
    padding: .75rem 1rem;
    cursor: pointer;
    list-style: none;
    -webkit-user-select: none;
    user-select: none;
    min-height: 48px;
  }
  summary.q-header::-webkit-details-marker { display: none; }
  summary.q-header:hover { background: #f0f4ff; }

  summary.q-header::after {
    content: '›';
    font-size: 1.25rem;
    color: var(--muted);
    flex-shrink: 0;
    line-height: 1;
    transition: transform .2s;
  }
  details[open] > summary.q-header::after { transform: rotate(90deg); }

  .q-num {
    font-weight: 700;
    color: var(--primary);
    white-space: nowrap;
    flex-shrink: 0;
    font-size: .9rem;
  }
  .q-preview {
    font-size: .875rem;
    color: var(--text);
    flex: 1;
    min-width: 0;
    line-height: 1.45;
  }
  .q-status {
    font-size: .75rem;
    font-weight: 700;
    flex-shrink: 0;
    margin-right: .15rem;
  }
  .q-status-done    { color: var(--success); }
  .q-status-partial { color: var(--muted); }

  .q-body {
    padding: .75rem 1rem 1rem;
    border-top: 1px solid var(--border);
  }
  .q-body img { max-width: 100%; height: auto; border-radius: 6px; display: block; margin-bottom: .5rem; }
  .q-full-text { font-size: .9rem; line-height: 1.5; margin-bottom: .75rem; color: var(--text); }

  /* sub-questions inside Q4 group */
  .sub-question { margin-bottom: .75rem; }
  .sub-question + .sub-question { padding-top: .75rem; border-top: 1px solid var(--border); }
  .sub-q-label { font-size: .9rem; line-height: 1.45; margin-bottom: .45rem; }

  .option-label {
    display: flex;
    align-items: flex-start;
    gap: .55rem;
    padding: .5rem .7rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: .4rem;
    cursor: pointer;
    font-size: .9rem;
    line-height: 1.4;
    transition: border-color .12s, background .12s;
  }
  .option-label:hover { border-color: var(--primary); background: #eff6ff; }
  .option-label input { margin-top: .15rem; flex-shrink: 0; }

  .option-label.correct  { background: #dcfce7; border-color: var(--success); }
  .option-label.wrong    { background: #fee2e2; border-color: var(--danger); }
  .option-label.revealed { background: #fef9c3; border-color: #ca8a04; }

  /* Image answer choices — single column */
  .img-options { display: flex; flex-direction: column; gap: .75rem; }
  .option-img {
    flex-direction: column;
    align-items: center;
    padding: .75rem;
    width: 100%;
  }
  .option-img img { width: 100%; max-width: 340px; height: auto; border-radius: 4px; pointer-events: none; }
  .option-img input { margin: 0 0 .5rem; }

  /* ── Score screen ─────────────────────────────────────────────────── */
  .score-circle {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1rem;
    font-weight: 700;
  }
  .score-circle .num  { font-size: 2rem; line-height: 1; }
  .score-circle .denom { font-size: .85rem; }
  .score-pass { background: #dcfce7; color: #166534; border: 3px solid var(--success); }
  .score-fail { background: #fee2e2; color: #991b1b; border: 3px solid var(--danger); }

  .result-row {
    display: flex;
    align-items: center;
    gap: .5rem;
    padding: .4rem .6rem;
    border-radius: 6px;
    font-size: .875rem;
    margin-bottom: .3rem;
  }
  .result-row.right { background: #f0fdf4; }
  .result-row.wrong { background: #fef2f2; }
  .result-icon { font-size: 1rem; }

  .divider { border: none; border-top: 1px solid var(--border); margin: 1.25rem 0; }

  /* ── Timer ────────────────────────────────────────────────────────── */
  .timer-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .4rem;
    padding: .5rem .9rem;
    border-radius: 6px;
    font-size: .875rem;
    font-weight: 700;
    margin-bottom: .75rem;
    background: #f0fdf4;
    color: var(--success);
    border: 1px solid #bbf7d0;
  }
  .timer-bar.warn   { background: #fef9c3; color: #854d0e; border-color: #fde047; }
  .timer-bar.danger { background: #fee2e2; color: var(--danger); border-color: #fca5a5; }

  /* ── Loading ──────────────────────────────────────────────────────── */
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    margin: 1.5rem auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hidden { display: none !important; }

  #portal {
    --hk-bg: light-dark(#f5f4ef, #151c20);
    --hk-panel: light-dark(#ffffff, #20292f);
    --hk-ink: light-dark(#17302f, #e5eee9);
    --hk-muted: light-dark(#566966, #b0c2bb);
    --hk-line: light-dark(#dce3de, #3c4e4b);
    --hk-soft: light-dark(#eaf2ed, #2b3b34);
    --hk-action: light-dark(#145b4c, #9dd7c0);
    --hk-onaction: light-dark(#ffffff, #102c23);
    --hk-warn: light-dark(#80501a, #f0ca8b);
    --hk-warnbg: light-dark(#fff3dd, #3d3425);
    color: var(--hk-ink);
    background: var(--hk-bg);
    color-scheme: light dark;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #portal h1 { font-size: 28px; line-height: 1.18; letter-spacing: -.6px; margin: 0 0 8px; font-weight: 600; color: var(--hk-ink); }
  #portal h2 { font-size: 19px; margin: 0 0 6px; font-weight: 600; color: var(--hk-ink); }
  #portal h3 { font-size: 16px; margin: 0 0 8px; font-weight: 600; }
  #portal p { color: var(--hk-ink); }
  #portal button, #portal select { font: inherit; color: inherit; }
  #portal button { cursor: pointer; }
  #portal button:focus-visible, #portal select:focus-visible { outline: 3px solid var(--hk-action); outline-offset: 3px; }
  #portal .hk-top { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; background: var(--hk-panel); padding: 18px 24px; border-bottom: 1px solid var(--hk-line); }
  #portal .hk-brand { letter-spacing: -.6px; font-size: 23px; font-weight: 700; line-height: 1.1; }
  #portal .hk-brand small { display: block; font-size: 11px; font-weight: 500; letter-spacing: 1.7px; color: var(--hk-muted); margin-top: 5px; }
  #portal .hk-context { margin-left: auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  #portal .hk-context label { font-size: 12px; font-weight: 600; }
  #portal .hk-context select { display: block; margin-top: 4px; min-width: 180px; background: var(--hk-panel); padding: 8px 10px; border: 1px solid var(--hk-line); border-radius: 6px; }
  #portal .hk-person { border-left: 1px solid var(--hk-line); padding-left: 16px; font-weight: 500; }
  #portal .hk-person small { display: block; color: var(--hk-muted); font-weight: 400; }
  #portal .hk-layout { flex: 1; display: grid; grid-template-columns: 166px minmax(0, 1fr); }
  #portal .hk-side { background: var(--hk-panel); border-right: 1px solid var(--hk-line); padding: 22px 12px; display: flex; flex-direction: column; gap: 5px; }
  #portal .hk-side button { border: 0; background: transparent; text-align: left; padding: 10px 12px; border-radius: 6px; color: var(--hk-muted); }
  #portal .hk-side button[aria-current="page"] { background: var(--hk-soft); color: var(--hk-action); font-weight: 600; }
  #portal .hk-main { padding: 28px; min-width: 0; }
  #portal .hk-kicker { font-size: 11px; letter-spacing: 1.3px; color: var(--hk-action); font-weight: 600; text-transform: uppercase; margin-bottom: 9px; }
  #portal .hk-muted { color: var(--hk-muted); }
  #portal .hk-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; flex-wrap: wrap; margin-bottom: 24px; }
  #portal .hk-button, #portal a.hk-button { border: 1px solid var(--hk-line); background: var(--hk-panel); padding: 8px 12px; border-radius: 6px; font-weight: 500; color: inherit; text-decoration: none; }
  #portal .hk-button.hk-primary { background: var(--hk-action); color: var(--hk-onaction); border-color: var(--hk-action); }
  #portal .hk-button:disabled { opacity: .65; cursor: default; }
  #portal .hk-button.hk-link { border: 0; padding: 3px 0; background: transparent; color: var(--hk-action); text-align: left; }
  #portal .hk-continue { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: center; padding: 22px; background: var(--hk-soft); border-radius: 9px; margin-bottom: 28px; }
  #portal .hk-tag { font-size: 11px; display: inline-block; padding: 3px 8px; background: var(--hk-soft); border-radius: 4px; color: var(--hk-action); font-weight: 500; }
  #portal .hk-tag.hk-warning { background: var(--hk-warnbg); color: var(--hk-warn); }
  #portal .hk-bar { height: 6px; background: light-dark(#d5e2d9, #41554a); border-radius: 4px; overflow: hidden; margin: 12px 0 7px; }
  #portal .hk-bar span { display: block; height: 100%; background: var(--hk-action); }
  #portal .hk-small { font-size: 12px; }
  #portal .hk-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  #portal .hk-card { background: var(--hk-panel); padding: 20px; border: 1px solid var(--hk-line); border-radius: 8px; }
  #portal .hk-card-top { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-bottom: 13px; }
  #portal .hk-index { font-size: 12px; color: var(--hk-muted); font-weight: 500; letter-spacing: .5px; }
  #portal .hk-phase { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; border-top: 1px solid var(--hk-line); padding-top: 12px; margin: 14px 0; }
  #portal .hk-phase small { display: block; color: var(--hk-muted); }
  #portal .hk-footer { padding: 12px 24px; border-top: 1px solid var(--hk-line); background: var(--hk-panel); font-size: 11px; color: var(--hk-muted); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  #portal .hk-quiz { background: var(--hk-panel); border: 1px solid var(--hk-line); border-radius: 8px; padding: 20px; max-width: 720px; }
  @media (max-width: 760px) {
    #portal .hk-layout { grid-template-columns: 1fr; }
    #portal .hk-side { flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--hk-line); padding: 9px; }
    #portal .hk-cards, #portal .hk-continue { grid-template-columns: 1fr; }
    #portal .hk-main { padding: 16px; }
  }

  footer {
    text-align: center;
    font-size: .75rem;
    color: var(--muted);
    margin-top: 1rem;
  }
</style>
</head>

<!-- ── App logic ───────────────────────────────────────────────────────────── -->
<script>
// ── State ─────────────────────────────────────────────────────────────────────
function phaseOf(raw) {
  const value = String(raw || '').trim().toUpperCase();
  return value === 'PRE' || value === 'POST' ? value : 'SINGLE';
}

function readQuizParams() {
  try {
    const p = new URLSearchParams(location.search || '');
    return {
      program: String(p.get('program') || '').trim().toLowerCase(),
      test: String(p.get('test') || '').trim(),
      lesson: String(p.get('lesson') || '').trim(),
      phase: phaseOf(p.get('phase')),
      phaseSpecified: p.has('phase'),
    };
  } catch (e) {
    return { program: '', test: '', lesson: '', phase: 'SINGLE', phaseSpecified: false };
  }
}

function freshState() {
  const params = readQuizParams();
  return {
    username: '',
    password: '',
    currentLesson: null,
    currentTestId: null,
    currentPhase: 'SINGLE',
    submissionId: '',
    requestedProgram: params.program,
    programId: '',
    pendingTest: params.test,
    pendingLesson: params.lesson,
    pendingPhase: params.phase,
    pendingPhaseSpecified: params.phaseSpecified,
    assignment: '',
    linkNote: '',
    tryCounts: {},
    tests: [],
    lessons: [],
    testsLoaded: false,
    programs: [],
    programNames: {},
    section: 'home',
    questions: [],
    timerInterval: null,
    timeLimit: 0,
  };
}

let state = freshState();

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── View helpers ──────────────────────────────────────────────────────────────
function show(id) {
  const signedOut = id === 'view-login';
  document.body.classList.toggle('signed-out', signedOut);
  document.getElementById('view-login').classList.toggle('hidden', !signedOut);
  document.getElementById('portal').classList.toggle('hidden', signedOut);
  ['view-lessons', 'view-quiz', 'view-score'].forEach(v => {
    document.getElementById(v).classList.toggle('hidden', v !== id);
  });
  if (!signedOut) paintChrome();
}

function setError(id, msg) {
  const el = document.getElementById(id);
  if (msg) { el.textContent = msg; el.classList.remove('hidden'); }
  else      { el.classList.add('hidden'); }
}

// ── API call ──────────────────────────────────────────────────────────────────
async function api(body, retries = 0) {
  if (state.programId && body.programId == null) body.programId = state.programId;
  const res = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify(body),
    redirect: 'follow',
  });
  const r = await res.json();
  if (r.error === 'busy_try_again' && retries < 3) {
    await sleep(400 * (retries + 1) + Math.random() * 200);
    return api(body, retries + 1);
  }
  return r;
}

// ── Login ─────────────────────────────────────────────────────────────────────
async function login() {
  setError('login-error', '');
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  if (!u || !p) { setError('login-error', 'Please enter your username and password.'); return; }

  const btn = document.querySelector('#view-login .btn-primary');
  btn.textContent = 'Signing in…';
  btn.disabled = true;

  try {
    const requested = state.requestedProgram || '';
    const r = await api({ action: 'get_tries', username: u, password: p, programId: '' });
    if (r.error === 'invalid_credentials') {
      setError('login-error', 'Incorrect username or password.');
      btn.textContent = 'Sign In'; btn.disabled = false;
      return;
    }
    state.username = u;
    state.password = p;
    rememberPrograms(r);
    const memberships = state.programs.slice();
    state.section = 'home';
    if (r.error === 'no_program' || !memberships.length) {
      state.assignment = 'none';
      state.programId = '';
      state.tests = [];
      state.lessons = [];
      showLessons();
      btn.textContent = 'Sign In'; btn.disabled = false;
      return;
    }
    if (memberships.length > 1 || r.needProgram) {
      state.assignment = 'many';
      state.programId = '';
      state.pendingTest = '';
      state.pendingLesson = '';
      state.tests = [];
      state.lessons = [];
      showLessons();
      btn.textContent = 'Sign In'; btn.disabled = false;
      return;
    }
    const assigned = memberships[0] || r.programId || '';
    if (requested && requested !== assigned) {
      state.linkNote = 'That link is for a different program. It does not change your assignment.';
      state.pendingTest = '';
      state.pendingLesson = '';
    }
    state.assignment = 'one';
    if (r.programId === assigned && Array.isArray(r.tests)) {
      state.programId = assigned;
      state.tryCounts = r.allTries || {};
      state.tests = r.tests || [];
      state.lessons = r.lessons || [];
      state.testsLoaded = true;
      showLessons();
      maybeOpenPending();
    } else {
      await chooseProgram(assigned);
    }
  } catch (err) {
    setError('login-error', 'Connection error. Please try again.');
  }
  btn.textContent = 'Sign In'; btn.disabled = false;
}

function logout() {
  stopTimer();
  try { sessionStorage.removeItem('quizSubmissionId'); } catch (e) {}
  state = freshState();
  document.getElementById('username').value = '';
  document.getElementById('password').value = '';
  show('view-login');
}

function rememberPrograms(r) {
  if (r && Array.isArray(r.programs) && r.programs.length) state.programs = r.programs.slice();
  if (r && r.programNames) state.programNames = r.programNames;
  if (r && r.programName && r.programId) {
    state.programNames[r.programId] = r.programName;
  }
}

function programLabel(id) {
  return (state.programNames && state.programNames[id]) || id || 'Program';
}

function showLessons() {
  setError('lesson-select-error', '');
  renderLessonGrid();
  show('view-lessons');
}

async function chooseProgram(id) {
  state.programId = id;
  state.section = 'home';
  const r = await api({ action: 'get_tries', username: state.username, password: state.password, programId: id });
  if (r.error) { setError('lesson-select-error', friendlyError(r.error)); return; }
  state.tests = r.tests || [];
  state.lessons = r.lessons || [];
  state.testsLoaded = Array.isArray(r.tests);
  state.tryCounts = r.allTries || {};
  rememberPrograms(r);
  showLessons();
  maybeOpenPendingTest();
}

function sameTest(t, pending) {
  return t.testId === pending || t.lesson === pending || String(t.testId).toUpperCase() === String(pending).toUpperCase();
}

function lessonMatches(lesson, pending) {
  const want = String(pending || '').trim().toLowerCase();
  if (!want) return false;
  const id = String(lesson.lessonId || '').toLowerCase();
  const url = String(lesson.url || '').toLowerCase();
  return id === want || id.indexOf(want + '@') === 0 || url.indexOf('/' + want + '/') >= 0;
}

function maybeOpenPending() {
  const pendingLesson = state.pendingLesson;
  const pending = state.pendingTest;
  state.pendingLesson = '';
  state.pendingTest = '';
  if (pendingLesson && !pending) {
    const lesson = (state.lessons || []).find(function (item) { return lessonMatches(item, pendingLesson); });
    if (!lesson) {
      setError('lesson-select-error', 'That lesson is not in your assigned program.');
      return;
    }
    openTeachingLesson(lesson);
    return;
  }
  if (!pending) return;
  const want = phaseOf(state.pendingPhase);
  const specified = state.pendingPhaseSpecified;
  const matches = (state.tests || []).filter(function (t) { return sameTest(t, pending); });
  let hit = matches.find(function (t) { return phaseOf(t.phase) === want; });
  if (!hit && !specified && matches.length === 1) hit = matches[0];
  if (!hit) {
    setError('lesson-select-error', 'That assessment is not in your assigned program.');
    return;
  }
  startLesson(hit.lesson || hit.testId, hit.testId, phaseOf(hit.phase));
}

function maybeOpenPendingTest() {
  maybeOpenPending();
}

function assessmentLabel(card) {
  if (!card || !card.linked) return 'Not linked';
  if (card.state === 'not_assigned') return 'Not assigned';
  if (card.state === 'done') return 'Complete';
  if (card.state === 'upcoming') return 'Upcoming';
  if (card.state === 'locked') return 'Closed';
  if (card.state === 'unavailable') return 'Unavailable';
  if (!card.tries) return 'Not started';
  return card.tries + '/' + (card.maxTries || 0);
}

function coveredByLesson(test) {
  const phase = phaseOf(test.phase);
  return (state.lessons || []).some(function (lesson) {
    const pre = lesson.pre || {};
    const post = lesson.post || {};
    return (pre.linked && pre.state !== 'not_assigned' && pre.testId === test.testId && phaseOf(pre.phase) === phase)
      || (post.linked && post.state !== 'not_assigned' && post.testId === test.testId && phaseOf(post.phase) === phase);
  });
}

function openTeachingLesson(lesson) {
  try {
    sessionStorage.setItem('hokulani-lesson-session', JSON.stringify({
      username: state.username,
      password: state.password,
      programId: state.programId,
      lessonId: lesson.lessonId,
      api: API_URL,
    }));
  } catch (e) {}
  location.href = lesson.url;
}

function lessonStarted(lesson) {
  const progress = lesson.progress || { done: 0, total: 0 };
  return progress.done > 0 || (lesson.topics || []).some(function (topic) { return topic.status; });
}

function lessonStatus(lesson) {
  if (lesson.availability === 'upcoming') return { text: 'Scheduled', warn: false };
  if (lesson.availability === 'locked') return { text: 'Closed', warn: false };
  const progress = lesson.progress || { done: 0, total: 0 };
  const finished = progress.total > 0 && progress.done >= progress.total;
  const unlinked = String(lesson.status || '').toUpperCase() === 'UNLINKED'
    || ((lesson.pre && lesson.pre.linked === false) && (lesson.post && lesson.post.linked === false));
  if (finished && unlinked) return { text: 'Assessment unlinked', warn: true };
  if (finished && phaseOwed(lesson.post)) return { text: 'POST outstanding', warn: true };
  if (finished && phaseOwed(lesson.pre)) return { text: 'PRE outstanding', warn: true };
  if (finished) return { text: 'Finished', warn: false };
  if (lessonStarted(lesson)) return { text: 'In progress', warn: false };
  return { text: 'Not started', warn: false };
}

function phaseSatisfied(card) {
  if (!card || card.linked === false || card.state === 'unlinked' || card.state === 'not_assigned') return false;
  if (card.submitted === true) return true;
  return card.state === 'done';
}

function phaseOwed(card) {
  if (!card || card.linked === false || card.state === 'unlinked' || card.state === 'not_assigned') return false;
  return !phaseSatisfied(card);
}

function phaseText(card) {
  if (!card || card.linked === false || card.state === 'unlinked') return 'Not connected';
  if (card.state === 'not_assigned') return 'Not assigned';
  if (card.state === 'upcoming') {
    const match = (state.tests || []).find(function (test) {
      return test.testId === card.testId && phaseOf(test.phase) === phaseOf(card.phase);
    });
    if (match && match.openAt) {
      const when = new Date(match.openAt);
      if (!isNaN(when.getTime())) {
        return 'Opens ' + when.toLocaleString('en-US', { timeZone: 'Pacific/Honolulu', month: 'short', day: 'numeric' });
      }
    }
    return 'Scheduled';
  }
  if (card.state === 'locked') return 'Closed';
  if (card.state === 'unavailable') return 'Unavailable';
  if (phaseSatisfied(card)) return 'Submitted';
  const tries = Number(card.tries) || 0;
  const max = Number(card.maxTries) || 0;
  if (tries > 0 && max > 0) return tries + ' of ' + max + ' attempts used';
  return 'Ready to start';
}

function phaseActionable(card) {
  return !!(card && card.linked && card.state === 'open');
}

function nextTopicTitle(lesson) {
  const topics = lesson.topics || [];
  const open = topics.find(function (topic) { return topic.status !== 'met' && topic.status !== 'support'; });
  if (open) return open.title || open.id;
  const resume = (lesson.progress && lesson.progress.resumeTopic) || '';
  const named = topics.find(function (topic) { return topic.id === resume; });
  return (named && (named.title || named.id)) || resume || 'the saved topic';
}

function latestTouch(lesson) {
  return (lesson.topics || []).reduce(function (latest, topic) {
    return topic.updatedAt && topic.updatedAt > latest ? topic.updatedAt : latest;
  }, '');
}

function continueLesson(lessons) {
  return lessons.filter(function (lesson) {
    if (lesson.availability === 'locked' || lesson.availability === 'upcoming') return false;
    const progress = lesson.progress || { done: 0, total: 0 };
    return lessonStarted(lesson) && progress.total && progress.done < progress.total;
  }).sort(function (a, b) { return latestTouch(b).localeCompare(latestTouch(a)); })[0] || null;
}

function tag(text, warn) {
  const span = document.createElement('span');
  span.className = 'hk-tag' + (warn ? ' hk-warning' : '');
  span.textContent = text;
  return span;
}

function lessonAction(lesson, status) {
  if (lesson.availability === 'upcoming') return { label: 'Not open yet', disabled: true };
  if (lesson.availability === 'locked') return { label: 'Closed', disabled: true };
  if (!lesson.url) return { label: 'No lesson link', disabled: true };
  if (status.text === 'Finished' || status.text === 'POST outstanding' || status.text === 'Assessment unlinked') {
    if ((lesson.progress || {}).done > 0) return { label: 'Review lesson', disabled: false };
  }
  return { label: lessonStarted(lesson) ? 'Resume lesson' : 'Start lesson', disabled: false };
}

function appendPhase(parent, label, card) {
  const cell = document.createElement('div');
  const small = document.createElement('small');
  small.textContent = label;
  const line = document.createElement('div');
  line.textContent = phaseText(card);
  cell.append(small, line);
  if (phaseSatisfied(card)) {
    const used = Number(card.tries) || 0;
    const max = Number(card.maxTries) || 0;
    if (used > 0 && max > 0) {
      const note = document.createElement('div');
      note.className = 'hk-small hk-muted';
      const left = Math.max(0, max - used);
      note.textContent = used + ' of ' + max + ' attempts used' + (left ? ' · ' + left + ' remaining' : '');
      cell.appendChild(note);
    }
  }
  if (phaseActionable(card)) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'hk-button hk-link';
    button.textContent = (phaseSatisfied(card) ? 'Retake ' : 'Start ') + label;
    button.onclick = function () { startLesson(card.testId, card.testId, phaseOf(card.phase)); };
    cell.appendChild(button);
  }
  parent.appendChild(cell);
}

function teachingCard(lesson, index, sectionName) {
  const status = lessonStatus(lesson);
  const progress = lesson.progress || { done: 0, total: 0 };
  const card = document.createElement('article');
  card.className = 'hk-card';
  const top = document.createElement('div');
  top.className = 'hk-card-top';
  const idx = document.createElement('span');
  idx.className = 'hk-index';
  idx.textContent = String(index + 1).padStart(2, '0') + ' / ' + String(sectionName || 'SCIENCE').toUpperCase();
  top.append(idx, tag(status.text, status.warn));
  const title = document.createElement('h3');
  title.textContent = lesson.title || lesson.lessonId;
  const blurb = document.createElement('p');
  blurb.className = 'hk-small hk-muted';
  blurb.textContent = LESSON_BLURB[lesson.lessonId] || lesson.title || '';
  card.append(top, title, blurb);
  if (progress.total) {
    const bar = document.createElement('div');
    bar.className = 'hk-bar';
    bar.setAttribute('role', 'progressbar');
    bar.setAttribute('aria-label', (lesson.title || 'Lesson') + ' topics complete');
    bar.setAttribute('aria-valuemin', '0');
    bar.setAttribute('aria-valuemax', String(progress.total));
    bar.setAttribute('aria-valuenow', String(progress.done));
    const fill = document.createElement('span');
    fill.style.width = Math.round((progress.done / progress.total) * 100) + '%';
    bar.appendChild(fill);
    const count = document.createElement('div');
    count.className = 'hk-small';
    count.textContent = progress.done + ' of ' + progress.total + ' topics complete';
    card.append(bar, count);
  }
  const supported = (lesson.topics || []).filter(function (topic) { return topic.support || topic.status === 'support'; });
  if (supported.length) {
    const note = document.createElement('p');
    note.className = 'hk-small';
    note.textContent = 'Continued with support on ' + supported.map(function (topic) { return topic.title || topic.id; }).join(', ') + '. Support is help, not an official test attempt.';
    card.appendChild(note);
  }
  const phases = document.createElement('div');
  phases.className = 'hk-phase';
  appendPhase(phases, 'PRE', lesson.pre);
  appendPhase(phases, 'POST', lesson.post);
  card.appendChild(phases);
  const action = lessonAction(lesson, status);
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'hk-button' + (action.disabled ? '' : ' hk-primary');
  button.textContent = action.label;
  button.disabled = action.disabled;
  if (!action.disabled) button.onclick = function () { openTeachingLesson(lesson); };
  card.appendChild(button);
  return card;
}

function assessmentCard(test, index, sectionName) {
  const card = document.createElement('article');
  card.className = 'hk-card';
  const top = document.createElement('div');
  top.className = 'hk-card-top';
  const idx = document.createElement('span');
  idx.className = 'hk-index';
  const id = String(test.testId || '').toUpperCase();
  idx.textContent = (id === 'SCI-DM' || String(test.lesson || '').toUpperCase() === 'L6')
    ? 'LAB'
    : String(sectionName || 'ASSESSMENT').toUpperCase();
  const phase = phaseOf(test.phase);
  const statusText = phaseText({
    linked: true,
    state: test.state,
    tries: test.tries,
    maxTries: test.maxTries,
    testId: test.testId,
    phase: phase,
  });
  top.append(idx, tag(statusText, test.state === 'unavailable' || test.state === 'locked'));
  const title = document.createElement('h3');
  title.textContent = test.title || LESSON_NAMES[test.lesson] || test.testId;
  const blurb = document.createElement('p');
  blurb.className = 'hk-small hk-muted';
  const media = id === 'SCI-DM' || String(test.lesson || '').toUpperCase() === 'L6';
  blurb.textContent = media
    ? 'Separate lab. The assessment stays on this card.'
    : (phase === 'SINGLE' ? 'Assigned on its own. It is not part of a teaching lesson card.' : phase + ' assessment');
  card.append(top, title, blurb);
  const phases = document.createElement('div');
  phases.className = 'hk-phase';
  appendPhase(phases, phase === 'SINGLE' ? 'TEST' : phase, {
    linked: true,
    state: test.state,
    tries: test.tries,
    maxTries: test.maxTries,
    testId: test.testId,
    phase: phase,
  });
  card.appendChild(phases);
  if (media) {
    const lab = document.createElement('a');
    lab.className = 'hk-button';
    lab.href = MEDIA_LAB;
    lab.textContent = 'Open lab';
    lab.style.display = 'inline-block';
    lab.style.marginRight = '8px';
    card.appendChild(lab);
  }
  return card;
}

function renderLessonGrid() {
  const grid = document.getElementById('lesson-grid');
  grid.replaceChildren();
  if (state.linkNote) setError('lesson-select-error', state.linkNote);
  const section = state.section || 'home';
  if (section === 'help') { renderHelp(grid); return; }
  if (section === 'account') { renderAccount(grid); return; }

  const heading = document.createElement('div');
  heading.className = 'hk-heading';
  const titles = document.createElement('div');
  const kicker = document.createElement('div');
  kicker.className = 'hk-kicker';
  kicker.textContent = state.programId ? programLabel(state.programId) : 'Program';
  const h1 = document.createElement('h1');
  const sectionTitle = { science: 'Science', mentoring: 'Mentoring', internship: 'Internship', college: 'College Transition', mindset: 'Mindset' }[section];
  h1.textContent = section === 'home' ? ('Aloha, ' + (state.username || 'student') + '.') : (sectionTitle || 'My lessons');
  const sub = document.createElement('p');
  sub.className = 'hk-muted';
  sub.textContent = state.programId
    ? 'Your work for this program, all in one place.'
    : 'Choose the program your instructor assigned.';
  titles.append(kicker, h1, sub);
  heading.appendChild(titles);
  grid.appendChild(heading);

  if (!state.programId) {
    const note = document.createElement('p');
    note.textContent = state.assignment === 'many'
      ? 'More than one program is assigned to this login. Please contact your instructor.'
      : 'Your program hasn’t been assigned yet. Please contact your instructor.';
    grid.appendChild(note);
    return;
  }

  const lessons = (state.lessons || []).slice().sort(function (a, b) { return (a.sort || 0) - (b.sort || 0); });
  if (section === 'home') {
    const current = continueLesson(lessons);
    if (current) {
      const progress = current.progress || { done: 0, total: 0 };
      const panel = document.createElement('section');
      panel.className = 'hk-continue';
      const copy = document.createElement('div');
      const k = document.createElement('div');
      k.className = 'hk-kicker';
      k.textContent = 'Continue where you left off';
      const h2 = document.createElement('h2');
      h2.textContent = current.title || current.lessonId;
      const next = document.createElement('p');
      next.textContent = 'Up next: ' + nextTopicTitle(current);
      const bar = document.createElement('div');
      bar.className = 'hk-bar';
      bar.setAttribute('role', 'progressbar');
      bar.setAttribute('aria-label', (current.title || 'Lesson') + ' progress');
      bar.setAttribute('aria-valuemin', '0');
      bar.setAttribute('aria-valuemax', String(progress.total || 0));
      bar.setAttribute('aria-valuenow', String(progress.done || 0));
      const fill = document.createElement('span');
      fill.style.width = progress.total ? Math.round((progress.done / progress.total) * 100) + '%' : '0%';
      bar.appendChild(fill);
      const saved = document.createElement('span');
      saved.className = 'hk-small';
      saved.textContent = progress.done + ' of ' + progress.total + ' topics complete · your work is saved';
      copy.append(k, h2, next, bar, saved);
      const resume = document.createElement('button');
      resume.type = 'button';
      resume.className = 'hk-button hk-primary';
      resume.textContent = 'Resume lesson';
      resume.onclick = function () { openTeachingLesson(current); };
      panel.append(copy, resume);
      grid.appendChild(panel);
    }
  }

  const tests = state.testsLoaded
    ? (state.tests || []).filter(function (test) { return !coveredByLesson(test); })
    : (!lessons.length ? ALL_LESSONS.map(function (lid) {
        return {
          lesson: lid,
          testId: lid,
          title: (LESSON_NAMES[lid] || lid).replace(/^Lesson \d+ – /, ''),
          strand: 'Science',
          state: 'open',
          tries: state.tryCounts[lid] || 0,
          maxTries: 2,
          phase: 'SINGLE',
        };
      }) : []);
  const groups = sectionGroups(lessons, tests).filter(function (group) {
    return section === 'home' || section === 'lessons' || section === group.id;
  });
  if (!groups.length) {
    const empty = document.createElement('p');
    empty.textContent = 'No lessons or assessments are assigned in this program.';
    grid.appendChild(empty);
    return;
  }
  groups.forEach(function (group) {
    const caption = document.createElement('h2');
    caption.className = 'hk-section-title';
    caption.textContent = group.name;
    const cards = document.createElement('div');
    cards.className = 'hk-cards';
    group.lessons.forEach(function (lesson, index) { cards.appendChild(teachingCard(lesson, index, group.name)); });
    group.tests.forEach(function (test, index) { cards.appendChild(assessmentCard(test, index, group.name)); });
    grid.append(caption, cards);
  });
}

function sectionIdFor(item, kind) {
  if (kind === 'lesson') {
    const id = String(item.lessonId || '');
    if (id.indexOf('sci-') === 0) return 'science';
    return 'science';
  }
  const strand = String(item.strand || '');
  if (strand === 'Mentoring') return 'mentoring';
  if (strand === 'Internship') return 'internship';
  if (strand === 'College') return 'college';
  if (strand === 'Mindset') return 'mindset';
  const id = String(item.testId || '').toUpperCase();
  if (id.indexOf('MENT-') === 0) return 'mentoring';
  if (id.indexOf('INT-') === 0) return 'internship';
  if (id.indexOf('COL-') === 0) return 'college';
  if (id.indexOf('TEAMS-') === 0) return 'mindset';
  return 'science';
}

function sectionGroups(lessons, tests) {
  const order = [
    ['science', 'Science'],
    ['mentoring', 'Mentoring'],
    ['internship', 'Internship'],
    ['college', 'College Transition'],
    ['mindset', 'Mindset'],
  ];
  return order.map(function (pair) {
    return {
      id: pair[0],
      name: pair[1],
      lessons: lessons.filter(function (lesson) { return sectionIdFor(lesson, 'lesson') === pair[0]; }),
      tests: tests.filter(function (test) { return sectionIdFor(test, 'test') === pair[0]; }),
    };
  }).filter(function (group) { return group.lessons.length || group.tests.length; });
}

function assignedSections() {
  const lessons = state.lessons || [];
  const tests = (state.tests || []).filter(function (test) { return !coveredByLesson(test); });
  return sectionGroups(lessons, tests).map(function (group) { return [group.id, group.name]; });
}

// ── Start a lesson ─────────────────────────────────────────────────────────────
function friendlyError(code) {
  if (code === 'not_released') return 'This test is not open right now.';
  if (code === 'max_attempts_reached') return 'You have used all attempts for this test. Contact your instructor if you need another try.';
  if (code === 'busy_try_again') return 'The server is busy. Please try again.';
  if (code === 'time_expired') return 'Time is up. Your attempt was saved.';
  if (code === 'invalid_attempt') return 'This attempt is no longer valid. Go back and start again.';
  if (code === 'invalid_credentials') return 'Session expired. Please sign in again.';
  if (code === 'bad_question_bank') return 'This test is not available (question bank). Contact your instructor.';
  if (code === 'no_questions_found') return 'No questions found for this test.';
  if (code === 'not_in_program') return 'You are not in that program.';
  if (code === 'need_program') return 'More than one program is assigned. Please contact your instructor.';
  if (code === 'test_not_assigned') return 'This test is not assigned in this program.';
  if (code === 'no_program') return 'You are not assigned to a program. Contact your instructor.';
  if (code === 'pre_required') return 'Complete the PRE for this lesson before the activities. That is a setting on this program.';
  if (code === 'lesson_not_assigned') return 'This lesson is not assigned in this program.';
  return code ? ('Could not load: ' + code) : 'Unknown error';
}

async function startLesson(lesson, testId, phase) {
  setError('lesson-select-error', '');
  const chosen = phaseOf(phase);
  document.getElementById('quiz-title').textContent = LESSON_NAMES[lesson] || lesson;
  document.getElementById('quiz-info').classList.add('hidden');
  document.getElementById('quiz-error').classList.add('hidden');
  document.getElementById('quiz-questions').innerHTML = '';
  document.getElementById('quiz-loading').classList.remove('hidden');
  document.getElementById('submit-btn').classList.add('hidden');
  show('view-quiz');

  try {
    const r = await api({
      action: 'auth_and_load',
      username: state.username,
      password: state.password,
      lesson,
      testId: testId || lesson,
      phase: chosen,
    });

    document.getElementById('quiz-loading').classList.add('hidden');

    if (r.error === 'invalid_credentials') {
      setError('quiz-error', friendlyError(r.error));
      setTimeout(logout, 2000);
      return;
    }
    if (r.error || !r.questions) {
      setError('quiz-error', friendlyError(r.error || 'unknown error'));
      return;
    }

    state.currentLesson = r.lesson || lesson;
    state.currentTestId = r.testId || testId || lesson;
    state.currentPhase = phaseOf(r.phase || chosen);
    state.submissionId = r.submissionId || '';
    const phaseLabel = state.currentPhase === 'SINGLE' ? '' : ' (' + state.currentPhase + ')';
    document.getElementById('quiz-title').textContent = (r.lessonName || LESSON_NAMES[lesson] || lesson) + phaseLabel;
    try { if (state.submissionId) sessionStorage.setItem('quizSubmissionId', state.submissionId); } catch (e) {}
    state.questions = r.questions;
    if (r.allTries) state.tryCounts = Object.assign({}, state.tryCounts, r.allTries);
    else state.tryCounts[lesson] = r.tries;
    if (r.tests) state.tests = r.tests;
    state.timeLimit = r.timeLimit || 0;
    const maxTries = r.maxTries || 2;

    const info = document.getElementById('quiz-info');
    let infoText = `Attempt ${r.tries + 1} of ${maxTries} — answer all questions then click Submit.`;
    if (state.timeLimit > 0) {
      const m = Math.floor(state.timeLimit / 60);
      const s = state.timeLimit % 60;
      infoText += ` Time remaining: ${m}:${s.toString().padStart(2, '0')}.`;
    }
    info.textContent = infoText;
    info.classList.remove('hidden');

    renderQuestions(r.questions);
    document.getElementById('submit-btn').classList.remove('hidden');
    document.getElementById('submit-btn').disabled = false;
    document.getElementById('submit-btn').textContent = 'Submit Answers';

    if (state.timeLimit > 0) startTimer(state.timeLimit);
    else document.getElementById('quiz-timer').classList.add('hidden');

  } catch (err) {
    document.getElementById('quiz-loading').classList.add('hidden');
    setError('quiz-error', 'Connection error. Please try again.');
  }
}

function renderQuestions(questions) {
  const LETTERS = ['A','B','C','D','E','F'];
  const container = document.getElementById('quiz-questions');
  container.innerHTML = '';

  let groupBody    = null;
  let groupDetails = null;
  let currentParent = null;
  let firstItem    = true;

  function makeDetails(extraClass) {
    const d = document.createElement('details');
    d.className = 'question-block' + (extraClass ? ' ' + extraClass : '');
    if (firstItem) { d.open = true; firstItem = false; }
    return d;
  }

  questions.forEach(q => {
    const numStr   = String(q.num);
    const subMatch = numStr.match(/^(\d+)([A-Za-z])$/);

    if (subMatch) {
      const parent = subMatch[1];

      if (parent !== currentParent) {
        currentParent = parent;

        const d = makeDetails('question-group');
        const s = document.createElement('summary');
        s.className = 'q-header';
        s.innerHTML = `<span class="q-num">${parent}.</span>`
          + `<span class="q-preview">Fill in the 10 blanks</span>`
          + `<span class="q-status"></span>`;

        groupBody = document.createElement('div');
        groupBody.className = 'q-body';

        d.appendChild(s);
        d.appendChild(groupBody);
        container.appendChild(d);
        groupDetails = d;
      }

      const subDiv = document.createElement('div');
      subDiv.className    = 'sub-question';
      subDiv.dataset.qnum = q.num;

      const qlabel = document.createElement('div');
      qlabel.className = 'sub-q-label';
      qlabel.innerHTML = q.question;
      subDiv.appendChild(qlabel);

      q.options.forEach((opt, oi) => {
        const lbl = document.createElement('label');
        const isImg = opt.startsWith('https://') || opt.startsWith('http://');
        lbl.className = isImg ? 'option-label option-img' : 'option-label';
        lbl.innerHTML = isImg
          ? `<input type="radio" name="q${q.num}" value="${LETTERS[oi]}"><img src="${opt}" alt="Option ${LETTERS[oi]}">`
          : `<input type="radio" name="q${q.num}" value="${LETTERS[oi]}"><span><strong>${LETTERS[oi]}.</strong> ${opt}</span>`;
        subDiv.appendChild(lbl);
      });

      groupBody.appendChild(subDiv);

    } else {
      currentParent = null;
      groupDetails  = null;
      groupBody     = null;

      const preview = q.question.replace(/<[^>]*>/g, '');
      const d = makeDetails();
      const s = document.createElement('summary');
      s.className = 'q-header';
      s.innerHTML = `<span class="q-num">${q.num}.</span>`
        + `<span class="q-preview">${preview}</span>`
        + `<span class="q-status"></span>`;

      const body = document.createElement('div');
      body.className = 'q-body';

      // If question contains <img> tags, show those in the body (not the full repeated text)
      const hasImgOpts = q.options.some(o => o.startsWith('https://') || o.startsWith('http://'));
      const qImgs = q.question.match(/<img[^>]*>/gi);
      if (qImgs) {
        const imgDiv = document.createElement('div');
        imgDiv.className = 'q-images';
        imgDiv.innerHTML = qImgs.join('');
        body.appendChild(imgDiv);
      }
      if (hasImgOpts) body.classList.add('img-options');
      q.options.forEach((opt, oi) => {
        const lbl = document.createElement('label');
        const isImg = opt.startsWith('https://') || opt.startsWith('http://');
        lbl.className = isImg ? 'option-label option-img' : 'option-label';
        lbl.innerHTML = isImg
          ? `<input type="radio" name="q${q.num}" value="${LETTERS[oi]}"><img src="${opt}" alt="Option ${LETTERS[oi]}">`
          : `<input type="radio" name="q${q.num}" value="${LETTERS[oi]}"><span><strong>${LETTERS[oi]}.</strong> ${opt}</span>`;
        body.appendChild(lbl);
      });

      d.appendChild(s);
      d.appendChild(body);
      container.appendChild(d);
    }
  });

  // Update header badge when an answer is selected
  container.addEventListener('change', e => {
    if (e.target.type !== 'radio') return;
    const details = e.target.closest('details');
    if (!details) return;
    const statusEl = details.querySelector(':scope > summary .q-status');
    if (!statusEl) return;

    if (details.classList.contains('question-group')) {
      const subs    = [...details.querySelectorAll('[data-qnum]')];
      const done    = subs.filter(s => details.querySelector(`input[name="q${s.dataset.qnum}"]:checked`)).length;
      const allDone = done === subs.length;
      statusEl.textContent = allDone ? '✓' : `${done}/${subs.length}`;
      statusEl.className   = 'q-status ' + (allDone ? 'q-status-done' : 'q-status-partial');
    } else {
      statusEl.textContent = '✓';
      statusEl.className   = 'q-status q-status-done';
    }
  });
}

// ── Submit quiz ────────────────────────────────────────────────────────────────
async function submitQuiz(force = false) {
  setError('quiz-error', '');
  stopTimer();

  // Collect answers
  const answers = {};
  let missing = false;
  state.questions.forEach(q => {
    const sel = document.querySelector(`input[name="q${q.num}"]:checked`);
    if (sel) answers[q.num] = sel.value;
    else missing = true;
  });

  if (!force && missing) {
    setError('quiz-error', 'Please answer all questions before submitting.');
    return;
  }

  const btn = document.getElementById('submit-btn');
  btn.textContent = 'Submitting…';
  btn.disabled = true;
  document.getElementById('quiz-loading').classList.remove('hidden');

  try {
    const r = await api({
      action:   'submit',
      username: state.username,
      password: state.password,
      lesson:   state.currentLesson,
      testId:   state.currentTestId || state.currentLesson,
      phase:    phaseOf(state.currentPhase),
      submissionId: state.submissionId || (function(){ try { return sessionStorage.getItem('quizSubmissionId') || ''; } catch (e) { return ''; } })(),
      answers,
    });

    document.getElementById('quiz-loading').classList.add('hidden');

    if (r.error && !r.ok) {
      setError('quiz-error', 'Submission error: ' + friendlyError(r.error));
      btn.textContent = 'Submit Answers'; btn.disabled = false;
      return;
    }

    state.tryCounts[state.currentLesson] = r.attempt;
    if (state.tests) {
      const phase = phaseOf(state.currentPhase);
      state.tests = state.tests.map(t => {
        if (t.testId === state.currentTestId && phaseOf(t.phase) === phase) {
          return Object.assign({}, t, { tries: r.attempt, state: (r.attempt >= (r.maxTries || t.maxTries) ? 'done' : t.state) });
        }
        return t;
      });
    }

    showSubmitted(r);
  } catch (err) {
    document.getElementById('quiz-loading').classList.add('hidden');
    setError('quiz-error', 'Connection error. Retry this same attempt. Do not start a new one.');
    btn.textContent = 'Submit Answers'; btn.disabled = false;
  }
}

function showSubmitted(r) {
  const phaseLabel = phaseOf(state.currentPhase) === 'SINGLE' ? '' : ' (' + phaseOf(state.currentPhase) + ')';
  const title = (LESSON_NAMES[state.currentLesson] || state.currentLesson || 'Test') + phaseLabel;
  document.getElementById('score-title').textContent = title;
  let msg = r.status === 'time_expired'
    ? 'Time is up. Your answers were saved.'
    : 'Your answers were submitted.';
  if (r.complete === false) {
    msg += ' Some questions were left blank.';
  }
  if (r.isLastTry) {
    msg += ' You have no attempts left on this cycle.';
  }
  document.getElementById('score-msg').textContent = msg;
  show('view-score');
}

// ── Back to lessons ────────────────────────────────────────────────────────────
async function backToLessons() {
  stopTimer();
  state.currentLesson = null;
  state.questions = [];
  show('view-lessons');
  try {
    const r = await api({ action: 'get_tries', username: state.username, password: state.password, programId: state.programId });
    if (!r.error) {
      state.tests = r.tests || [];
      state.lessons = r.lessons || [];
      state.testsLoaded = Array.isArray(r.tests);
      state.tryCounts = r.allTries || state.tryCounts;
    }
  } catch (e) {}
  renderLessonGrid();
}

// ── Timer ──────────────────────────────────────────────────────────────────────
function startTimer(seconds) {
  stopTimer();
  let remaining = seconds;
  const el = document.getElementById('quiz-timer');
  el.className = 'timer-bar';
  el.classList.remove('hidden');

  function tick() {
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    el.textContent = '⏱ ' + m + ':' + s.toString().padStart(2, '0') + ' remaining';
    if (remaining <= 30)       el.className = 'timer-bar danger';
    else if (remaining <= 120) el.className = 'timer-bar warn';
    else                       el.className = 'timer-bar';
    if (remaining <= 0) { stopTimer(); submitQuiz(true); return; }
    remaining--;
  }
  tick();
  state.timerInterval = setInterval(tick, 1000);
}

function stopTimer() {
  if (state.timerInterval) { clearInterval(state.timerInterval); state.timerInterval = null; }
  const el = document.getElementById('quiz-timer');
  if (el) el.classList.add('hidden');
}

  if (e.key === 'Enter') login();
});
document.getElementById('username').addEventListener('keydown', e => {
